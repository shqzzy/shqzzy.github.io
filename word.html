<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>A4分页自适应英文字帖生成器（修复版）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; height: 100vh; background: #f5f7fa; overflow: hidden; }

    /* 左侧预览区 */
    .preview-wrap { flex: 1; padding: 20px; overflow: auto; }
    .page-info {
      max-width: 900px; margin: 0 auto 12px; padding: 8px 12px;
      background: #eef2ff; color: #3730a3; border-radius: 6px;
      font-size: 13px; line-height: 1.6;
    }
    .page-info b { color: #1e3a8a; }
    .page-info .warn { color: #b45309; }
    #canvasBox {
      background: #fff; padding: 24px; margin: 0 auto;
      box-shadow: 0 2px 12px rgba(0,0,0,.08); border-radius: 8px;
      width: 100%; max-width: 900px;
    }
    /* 画布按内部分辨率等比显示，宽高比严格=纸张比例 */
    #paperCanvas { width: 100%; height: auto; display: block; }
    #paperCanvas.actual-size { width: 210mm !important; }

    /* 右侧控制面板 */
    .control-panel { width: 340px; background: #fff; padding: 20px; border-left: 1px solid #e5e7eb; overflow-y: auto; }
    .btn-group { display: flex; gap: 10px; margin-bottom: 16px; }
    button { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 14px; }
    .btn-export { background: #f0f4ff; color: #2563eb; }
    .btn-print { background: #111827; color: #fff; }
    .btn-actual { background: #fff; color: #374151; border: 1px solid #ddd; }
    textarea { width: 100%; height: 130px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 16px; resize: none; font-size: 14px; line-height: 1.5; }
    .control-item { margin-bottom: 16px; }
    .control-item label { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 14px; color: #333; }
    input[type="range"] { width: 100%; }
    .switch-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; font-size: 14px; }
    .divider { height: 1px; background: #eee; margin: 20px 0; }
    select { width: 100%; padding: 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    input[type="color"] { width: 100%; height: 34px; border: none; cursor: pointer; }
    .tip { font-size: 12px; color: #888; margin-top: 6px; line-height: 1.5; }

    .font-tab-box { display: flex; gap: 0; margin: 8px 0; }
    .font-tab-box button { flex: 1; padding: 7px; border: 1px solid #ddd; background: #fff; color: #333; }
    .font-tab-box button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .tab-left { border-radius: 6px 0 0 6px; border-right: none; }
    .tab-right { border-radius: 0 6px 6px 0; }

    /* 打印分页容器：屏幕隐藏，打印时显示 */
    #printPages { display: none; }

    /* ====================== 打印专用样式 ====================== */
    @media print {
      @page { size: A4 portrait; margin: 6mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      body { background: #fff; display: block; overflow: visible; height: auto; }
      .no-print { display: none !important; }
      .preview-wrap { padding: 0; overflow: visible; }
      #canvasBox { display: none !important; }
      #printPages { display: block; }
      /* 每页图片宽度 = 210mm - 左右各6mm 页边距，高度按原比例自适应，保证不变形 */
      .print-page { width: 198mm; margin: 0 auto 6mm; page-break-after: always; break-after: page; }
      .print-page:last-child { page-break-after: auto; break-after: auto; }
      .print-page img { width: 198mm; height: auto; display: block; }
    }
  </style>
</head>
<body>
  <!-- 左侧字帖预览 -->
  <div class="preview-wrap">
    <div class="page-info no-print" id="pageInfo">纸张：A4 210 × 297 mm</div>
    <div id="canvasBox">
      <canvas id="paperCanvas"></canvas>
    </div>
    <!-- 打印时按 A4 页高切片分页 -->
    <div id="printPages"></div>
  </div>

  <!-- 右侧设置面板 -->
  <div class="control-panel no-print">
    <div class="btn-group">
      <button class="btn-export" id="exportBtn">导出</button>
      <button class="btn-print" id="printBtn">打印</button>
    </div>
    <div class="btn-group">
      <button class="btn-actual" id="actualSizeBtn">按 A4 实际尺寸预览</button>
    </div>

    <textarea id="wordInput" placeholder="输入格式：英文|中文，每行一条
thirty|三十
forty|四十
They are taking pictures.|他们正在拍照。
What are they doing?|他们在做什么？">thirty|三十
forty|四十
fifty|五十
sixty|六十
seventy|七十
eighty|八十
ninety|九十
They are taking pictures.|他们正在拍照。
What are they doing?|他们在做什么？</textarea>

    <div class="switch-row">
      <span>显示中文释义</span>
      <input type="checkbox" id="showCn" checked>
    </div>
    <div class="switch-row">
      <span>首字高亮</span>
      <input type="checkbox" id="firstHigh">
    </div>
    <div class="switch-row">
      <span>插入空行</span>
      <input type="checkbox" id="addBlank" checked>
    </div>
    <div class="switch-row">
      <span>防重叠（自动缩放+中文换行）</span>
      <input type="checkbox" id="autoFit" checked>
    </div>
    <div class="switch-row">
      <span>长句自动分行书写</span>
      <input type="checkbox" id="wrapLong" checked>
    </div>

    <div class="divider"></div>

    <div class="control-item">
      <label>方格类型 <span id="gridTypeText">四线格</span></label>
      <select id="gridType">
        <option value="four">四线格</option>
        <option value="two">双线格</option>
      </select>
    </div>
    <div class="control-item">
      <label>行高 <span id="lineHeightVal">11.4mm</span></label>
      <input type="range" id="lineHeight" min="8" max="16" step="0.2" value="11.4">
    </div>
    <div class="control-item">
      <label>行间距 <span id="gapVal">4.5mm</span></label>
      <input type="range" id="lineGap" min="2" max="8" step="0.1" value="4.5">
    </div>
    <!-- 修正：页边距单位为 mm（原版 36 被当成 36mm，A4 净宽仅剩 138mm） -->
    <div class="control-item">
      <label>页边距 <span id="marginVal">15mm</span></label>
      <input type="range" id="margin" min="5" max="40" step="1" value="15">
    </div>
    <div class="control-item">
      <label>最小自动缩放 <span id="minScaleVal">60%</span></label>
      <input type="range" id="minScale" min="40" max="100" step="5" value="60">
      <div class="tip">开启后：长句自动等比缩放不压字；缩到下限仍放不下时，中文自动换到该行下方。关闭则只缩放、不换行。</div>
    </div>

    <div class="divider"></div>

    <div class="control-item">
      <label>字体 <span id="currentFontName">Comic Sans 圆润手写</span></label>
      <div class="font-tab-box">
        <button id="tabWinFont" class="tab-left active">Windows自带练字字体</button>
        <button id="tabLocalInstallFont" class="tab-right">本机额外安装字体</button>
      </div>
      <select id="winFontSelect">
        <option value="Comic Sans MS">Comic Sans 圆润手写</option>
        <option value="Lucida Calligraphy">Lucida 意大利花体</option>
        <option value="Arial">Arial 标准无衬线</option>
        <option value="Times New Roman">Times 经典衬线</option>
        <option value="Courier New">Courier 等宽练字体</option>
        <option value="Verdana">Verdana 清晰阅读体</option>
        <option value="Georgia">Georgia 柔和衬线</option>
        <option value="Lucida Sans Unicode">Lucida 清爽手写</option>
        <option value="Palatino Linotype">Palatino 优雅练字</option>
        <option value="Trebuchet MS">Trebuchet 圆润印刷</option>
      </select>
      <select id="localInstallFontSelect" style="display:none;margin-top:8px;">
        <option value="ItalianHand">意大利斜体（需手动安装）</option>
        <option value="NanxiangStick">南翔棒棒体（需手动安装）</option>
        <option value="ShuQiao HengShuiTi">舒窈衡水体（需手动安装）</option>
      </select>
    </div>
    <div class="control-item">
      <label>字体大小 <span id="fontSizeVal">85%</span></label>
      <input type="range" id="fontScale" min="60" max="120" value="85">
    </div>
    <div class="control-item">
      <label>上下偏移 <span id="offsetVal">0%</span></label>
      <input type="range" id="vertOffset" min="-20" max="20" value="0">
    </div>

    <div class="divider"></div>

    <div class="control-item">
      <label>描红数量 <span id="traceNumVal">1</span></label>
      <input type="range" id="traceCount" min="1" max="5" value="1">
    </div>
    <div class="control-item">
      <label>描红颜色</label>
      <input type="color" id="traceColor" value="#ff6666">
    </div>
    <div class="control-item">
      <label>线条颜色</label>
      <input type="color" id="lineColor" value="#94a3b8">
    </div>

    <div class="divider"></div>

    <div class="control-item">
      <label>画布尺寸模式 <span id="sizeModeText">自动适配内容</span></label>
      <select id="canvasSizeMode">
        <option value="auto">自动适配内容</option>
        <option value="a4-1">A4 单页(297mm)</option>
        <option value="a4-2">A4 双页(594mm)</option>
        <option value="a4-3">A4 三页(891mm)</option>
      </select>
      <div class="tip">内容超过所选页数时自动扩展到整数页，不会被裁掉。</div>
    </div>
    <div class="control-item">
      <label>画布最小高度 <span id="canvasHeightVal">260mm</span></label>
      <input type="range" id="canvasHeightSlider" min="100" max="800" value="260" step="10">
      <div class="tip">仅「自动适配」模式生效，分页模式锁定固定高度。</div>
    </div>
  </div>

  <script>
    // ============ 基础常量 ============
    const A4_W_MM = 210, A4_H_MM = 297;                 // A4 纵向尺寸（mm）
    const BASE_PX_PER_MM = 96 / 25.4;                    // 96dpi 基准
    const DPI_SCALE = 2;                                 // 高清渲染倍率（约192dpi），导出/打印更清晰
    const S = DPI_SCALE;                                 // 像素常量缩放
    const PAD_L = 8 * S, PAD_R = 10 * S;                 // 行内左右内缩进（测量与绘制必须一致）
    const CN_FONT = '"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Heiti SC",sans-serif';

    function mm2px(mm) { return mm * BASE_PX_PER_MM * DPI_SCALE; }
    function px2mm(px) { return px / (BASE_PX_PER_MM * DPI_SCALE); }

    const canvas = document.getElementById('paperCanvas');
    const ctx = canvas.getContext('2d');

    let config = {
      words: [],
      showCn: true,
      firstHigh: false,
      addBlank: true,
      autoFit: true,          // 防重叠
      wrapLong: true,         // 长句自动分行书写
      minAutoScale: 60,       // 自动缩放下限（%），低于此值优先换行/分行
      gridType: 'four',
      lineHeight: 11.4,
      lineGap: 4.5,
      margin: 15,             // 页边距 mm（修正：原版 36 被当成 36mm，A4 净宽只剩 138mm）
      font: 'Comic Sans MS',
      fontScale: 85,
      vertOffset: 0,
      traceCount: 1,
      traceColor: '#ff6666',
      lineColor: '#94a3b8',
      extraBottomSpace: 10,   // 底部留白 mm（原版 80 过大）
      minCanvasMM: 260,
      sizeMode: 'auto'
    };

    // ============ 解析输入 ============
    function parseInputText() {
      const text = document.getElementById('wordInput').value.trim();
      if (!text) { config.words = []; renderPaper(); return; }
      config.words = text.split('\n')
        .filter(l => l.trim() !== '')
        .map(line => {
          const arr = line.split(/[|｜]/).map(x => x.trim());  // 兼容全角｜
          return { en: arr[0] || '', cn: arr[1] || '' };
        });
      renderPaper();
    }

    // ============ 格子绘制 ============
    function gridLines(y, lineH, lineC, type) {
      const marginPx = mm2px(config.margin);
      const width = canvas.width - marginPx * 2;
      const xStart = marginPx;
      ctx.strokeStyle = lineC;
      ctx.lineWidth = 1 * S / 2;
      if (type === 'two') {
        ctx.setLineDash([4 * S, 4 * S]);
        ctx.beginPath(); ctx.moveTo(xStart, y + lineH * 0.18); ctx.lineTo(xStart + width, y + lineH * 0.18); ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(xStart, y + lineH * 0.82); ctx.lineTo(xStart + width, y + lineH * 0.82); ctx.stroke();
      } else {
        const sub = lineH / 4;
        for (let i = 0; i <= 4; i++) {
          ctx.beginPath();
          ctx.setLineDash((i === 1 || i === 3) ? [4 * S, 4 * S] : []);
          ctx.moveTo(xStart, y + sub * i);
          ctx.lineTo(xStart + width, y + sub * i);
          ctx.stroke();
        }
      }
      ctx.setLineDash([]);
    }

    function enFontFamily() { return `"${config.font}", ${CN_FONT}`; }

    // ============ 布局：先测量后排版，输出扁平物理行 ============
    // 单行策略：同行 → 中文换行 → 长句分行（按单词拆到多格），全程保证不重叠、不出血
    function computeLayout(availW) {
      const lineHpx = mm2px(config.lineHeight);
      const gapPx = mm2px(config.lineGap);
      const baseFont = lineHpx * config.fontScale / 100;
      const contentW = availW - PAD_L - PAD_R;
      const safeGap = 8 * S;
      const G = 12 * S + 16 * S * config.traceCount;     // 字间距（随字号同比缩放）

      const measureEn = (fs, text) => {
        ctx.font = `${fs}px ${enFontFamily()}`;
        return ctx.measureText(text).width * (1 + config.traceCount) + G * (fs / baseFont);
      };
      const measureCn = (fs, cn) => {
        ctx.font = `${fs}px ${CN_FONT}`;
        return ctx.measureText(cn).width;
      };
      const rowH = cnLineH => lineHpx + gapPx + (config.addBlank ? lineHpx / 2 : 0) + (cnLineH || 0);

      // 按单词贪心分行
      function wrapWords(text, fs) {
        const words = text.split(/\s+/).filter(Boolean);
        if (words.length < 2) return [text];
        const lines = [];
        let cur = '';
        for (const w of words) {
          const test = cur ? cur + ' ' + w : w;
          if (measureEn(fs, test) > contentW && cur) { lines.push(cur); cur = w; }
          else cur = test;
        }
        if (cur) lines.push(cur);
        return lines;
      }

      const out = [];
      config.words.forEach(item => {
        const cn = (config.showCn && item.cn) ? item.cn : '';
        const enW0 = measureEn(baseFont, item.en);
        const cnW0 = cn ? measureCn(baseFont * 0.8, cn) : 0;
        const need = enW0 + (cnW0 ? safeGap + cnW0 : 0);

        let enFont = baseFont, cnFont = baseFont * 0.8;
        let mode = 'single';                              // single | cnBelow | wrap

        if (need > contentW) {
          const s = contentW / need;
          if (!config.autoFit || s >= config.minAutoScale / 100) {
            // 同行等比缩放即可放下
            enFont = baseFont * s;
            cnFont = baseFont * 0.8 * s;
          } else {
            // 先试：中文换到行下方，英文用满宽
            const se = Math.min(1, contentW / enW0);
            if (se >= config.minAutoScale / 100 || !config.wrapLong || !/\s/.test(item.en.trim())) {
              mode = 'cnBelow';
              enFont = baseFont * se;
              cnFont = baseFont * 0.8 * Math.min(1, contentW / (cnW0 || 1));
            } else {
              // 缩得太小 → 长句按单词分行书写，保持标准字号
              mode = 'wrap';
              enFont = baseFont;
              cnFont = baseFont * 0.8;
            }
          }
        }

        if (mode === 'wrap') {
          const lines = wrapWords(item.en, enFont);
          lines.forEach((text, i) => {
            const isLast = i === lines.length - 1;
            // 单个超长单词仍可能超宽，按行再缩放
            let fs = enFont;
            let w = measureEn(fs, text);
            if (w > contentW) { fs = enFont * (contentW / w); w = contentW; }
            let rowCn = '', rowCnFont = cnFont, cnBelow = false, cnLineH = 0;
            if (isLast && cn) {
              rowCn = cn;
              const cw = measureCn(cnFont, cn);
              if (w + safeGap + cw > contentW) {          // 末行放不下 → 中文落到该行下方
                cnBelow = true;
                rowCnFont = cnFont * Math.min(1, contentW / cw);
                cnLineH = rowCnFont * 1.15 + 6 * S;
              }
            }
            out.push({ text, enFont: fs, cn: rowCn, cnFont: rowCnFont, cnBelow, h: rowH(cnLineH) });
          });
          return;
        }

        if (mode === 'cnBelow') {
          const cw = cn ? measureCn(cnFont, cn) : 0;
          const cnLineH = cn ? cnFont * 1.15 + 6 * S : 0;
          out.push({ text: item.en, enFont, cn, cnFont, cnBelow: !!cn, h: rowH(cnLineH) });
          return;
        }

        out.push({ text: item.en, enFont, cn, cnFont, cnBelow: false, h: rowH(0) });
      });

      return out;
    }

    // ============ 主渲染 ============
    function renderPaper() {
      // 修正：画布宽度严格等于 A4 宽（原版取浏览器容器宽度，宽高比不是 210:297）
      canvas.width = Math.round(mm2px(A4_W_MM));

      const marginPx = mm2px(config.margin);
      const lineHpx = mm2px(config.lineHeight);
      const availW = canvas.width - marginPx * 2;
      const rows = computeLayout(availW);

      let contentH = marginPx * 2 + mm2px(config.extraBottomSpace);
      rows.forEach(r => contentH += r.h);

      // 高度：分页模式锁定页数；内容超出时自动向上取整到整数页，绝不裁切
      const pageHpx = mm2px(A4_H_MM);
      let pages = 1, expanded = false, H;
      if (config.sizeMode === 'a4-2') pages = 2;
      else if (config.sizeMode === 'a4-3') pages = 3;

      if (config.sizeMode === 'auto') {
        H = Math.max(contentH, mm2px(config.minCanvasMM));
      } else {
        H = pageHpx * pages;
        if (contentH > H) { pages = Math.ceil(contentH / pageHpx); H = pageHpx * pages; expanded = true; }
      }
      canvas.height = Math.round(H);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 顶部状态条
      const info = document.getElementById('pageInfo');
      let warn = '';
      if (expanded) warn += ` ｜ <span class="warn">内容超出所选页数，已自动扩展为 ${pages} 页</span>`;
      if (rows.some(r => r.cnBelow)) warn += ' ｜ 部分中文已自动换到行下方';
      info.innerHTML = `纸张：A4 210 × 297 mm ｜ 画布：<b>${A4_W_MM} × ${px2mm(canvas.height).toFixed(0)} mm（${pages} 页）</b>`
        + ` ｜ 分辨率 ${Math.round(96 * DPI_SCALE)}dpi${warn}`;

      if (config.words.length === 0) {
        ctx.fillStyle = '#888';
        ctx.font = `${16 * S}px ${CN_FONT}`;
        ctx.fillText('请在右侧输入 英文|中文，每行一条', marginPx, marginPx + 30 * S);
        return;
      }

      // 逐行绘制
      let currentY = marginPx;
      ctx.textBaseline = 'alphabetic';
      rows.forEach(row => {
        gridLines(currentY, lineHpx, config.lineColor, config.gridType);
        const baseline = currentY + (config.gridType === 'two' ? lineHpx * 0.82 : lineHpx / 2) + mm2px(config.vertOffset);
        const k = row.enFont / (lineHpx * config.fontScale / 100);
        let x = marginPx + PAD_L;

        // 英文
        ctx.font = `${row.enFont}px ${enFontFamily()}`;
        if (config.firstHigh && row.text.length > 0) {
          const first = row.text[0], rest = row.text.slice(1);
          ctx.fillStyle = config.traceColor;
          ctx.fillText(first, x, baseline);
          x += ctx.measureText(first).width;
          ctx.fillStyle = '#000';
          ctx.fillText(rest, x, baseline);
          x += ctx.measureText(rest).width;
        } else {
          ctx.fillStyle = '#000';
          ctx.fillText(row.text, x, baseline);
          x += ctx.measureText(row.text).width;
        }
        x += 12 * S * k;

        // 描红
        ctx.fillStyle = config.traceColor;
        for (let i = 0; i < config.traceCount; i++) {
          ctx.fillText(row.text, x, baseline);
          x += ctx.measureText(row.text).width + 16 * S * k;
        }

        // 中文释义
        if (row.cn) {
          ctx.font = `${row.cnFont}px ${CN_FONT}`;
          ctx.fillStyle = '#333';
          if (row.cnBelow) {
            ctx.fillText(row.cn, marginPx + PAD_L, currentY + lineHpx + row.cnFont * 1.05);
          } else {
            const w = ctx.measureText(row.cn).width;
            ctx.fillText(row.cn, canvas.width - marginPx - PAD_R - w, baseline);
          }
        }

        currentY += row.h;
      });
    }

    // ============ 打印：按 A4 页高切片，一页一张，比例不变形 ============
    function buildPrintPages(done) {
      const box = document.getElementById('printPages');
      box.innerHTML = '';
      const pageHpx = Math.round(mm2px(A4_H_MM));
      const n = Math.max(1, Math.ceil(canvas.height / pageHpx));
      const imgs = [];
      for (let i = 0; i < n; i++) {
        const h = Math.min(pageHpx, canvas.height - i * pageHpx);
        const c = document.createElement('canvas');
        c.width = canvas.width; c.height = h;
        const cc = c.getContext('2d');
        cc.fillStyle = '#fff'; cc.fillRect(0, 0, c.width, c.height);
        cc.drawImage(canvas, 0, i * pageHpx, canvas.width, h, 0, 0, canvas.width, h);
        const img = new Image();
        img.src = c.toDataURL('image/png');
        const div = document.createElement('div');
        div.className = 'print-page';
        div.appendChild(img);
        box.appendChild(div);
        imgs.push(img);
      }
      // 图片解码是异步的，必须等全部就绪再打印，否则可能打出空白页
      Promise.all(imgs.map(im => new Promise(res => {
        if (im.complete) res(); else { im.onload = res; im.onerror = res; }
      }))).then(() => { if (done) done(); });
    }

    // ============ 控件绑定 ============
    function bindAllControl() {
      document.getElementById('wordInput').addEventListener('input', parseInputText);

      ['showCn', 'firstHigh', 'addBlank', 'autoFit', 'wrapLong'].forEach(id => {
        document.getElementById(id).onchange = e => { config[id] = e.target.checked; renderPaper(); };
      });

      function bindSlider(id, key, spanId, unit = '') {
        const s = document.getElementById(id), span = document.getElementById(spanId);
        s.oninput = () => {
          config[key] = Number(s.value);
          if (span) span.innerText = s.value + unit;
          renderPaper();
        };
      }
      bindSlider('lineHeight', 'lineHeight', 'lineHeightVal', 'mm');
      bindSlider('lineGap', 'lineGap', 'gapVal', 'mm');
      bindSlider('margin', 'margin', 'marginVal', 'mm');
      bindSlider('minScale', 'minAutoScale', 'minScaleVal', '%');
      bindSlider('fontScale', 'fontScale', 'fontSizeVal', '%');
      bindSlider('vertOffset', 'vertOffset', 'offsetVal', '%');
      bindSlider('traceCount', 'traceCount', 'traceNumVal', '');

      const chSlider = document.getElementById('canvasHeightSlider'), chVal = document.getElementById('canvasHeightVal');
      chSlider.oninput = () => { config.minCanvasMM = Number(chSlider.value); chVal.innerText = chSlider.value + 'mm'; renderPaper(); };

      const sizeSel = document.getElementById('canvasSizeMode'), sizeTxt = document.getElementById('sizeModeText');
      sizeSel.onchange = e => { config.sizeMode = e.target.value; sizeTxt.innerText = e.target.options[e.target.selectedIndex].text; renderPaper(); };

      document.getElementById('gridType').onchange = e => {
        config.gridType = e.target.value;
        document.getElementById('gridTypeText').innerText = e.target.options[e.target.selectedIndex].text;
        renderPaper();
      };

      document.getElementById('traceColor').oninput = e => { config.traceColor = e.target.value; renderPaper(); };
      document.getElementById('lineColor').oninput = e => { config.lineColor = e.target.value; renderPaper(); };

      document.getElementById('exportBtn').onclick = () => {
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = '英文字帖_A4.png';
        a.click();
      };

      document.getElementById('printBtn').onclick = () => buildPrintPages(() => window.print());
      window.addEventListener('beforeprint', () => buildPrintPages());

      document.getElementById('actualSizeBtn').onclick = e => {
        canvas.classList.toggle('actual-size');
        e.target.innerText = canvas.classList.contains('actual-size') ? '恢复适应宽度预览' : '按 A4 实际尺寸预览';
      };

      // 字体双标签
      const tabWin = document.getElementById('tabWinFont');
      const tabLocal = document.getElementById('tabLocalInstallFont');
      const selWin = document.getElementById('winFontSelect');
      const selLocal = document.getElementById('localInstallFontSelect');
      const nameSpan = document.getElementById('currentFontName');
      const useWin = () => {
        tabWin.classList.add('active'); tabLocal.classList.remove('active');
        selWin.style.display = 'block'; selLocal.style.display = 'none';
        config.font = selWin.value;
        nameSpan.innerText = selWin.options[selWin.selectedIndex].text;
        renderPaper();
      };
      const useLocal = () => {
        tabLocal.classList.add('active'); tabWin.classList.remove('active');
        selLocal.style.display = 'block'; selWin.style.display = 'none';
        config.font = selLocal.value;
        nameSpan.innerText = selLocal.options[selLocal.selectedIndex].text;
        renderPaper();
      };
      tabWin.onclick = useWin;
      tabLocal.onclick = useLocal;
      selWin.onchange = useWin;
      selLocal.onchange = useLocal;
    }

    window.addEventListener('load', () => { bindAllControl(); setTimeout(parseInputText, 80); });

  </script>
</body>
</html>
