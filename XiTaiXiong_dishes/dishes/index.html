<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1">
    <title>菜品营养知识答题系统（成绩明细版）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 12px;
        }
        .container {
            max-width: 950px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        /*登录区*/
        .login-box {
            text-align: center;
            padding: 40px 0;
        }
        .login-box h2 {
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .input-name {
            width: min(320px,90%);
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 20px;
            outline: none;
        }
        .input-name:focus {border-color: #3498db;}
        .btn {
            padding: 12px 32px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {background-color: #2980b9;}
        /*答题区*/
        .exam-box {display: none;}
        .user-info {
            text-align: right;
            color: #7f8c8d;
            margin-bottom: 16px;
            font-size:15px;
        }
        .title {
            text-align: center;
            color: #2c3e50;
            margin-bottom:20px;
            font-size:clamp(22px,4vw,30px);
        }
        /*单题外层布局*/
        .question-item {
            display:flex;
            gap:20px;
            margin-bottom:22px;
            padding:18px;
            border:1px solid #eee;
            border-radius:10px;
            align-items:center;
        }
        /* 图片+圆环 共用容器：PC横向、手机纵向 */
        .img-ring-wrap{
            display:flex;
            gap:16px;
            align-items:center;
            flex-shrink:0;
        }
        @media screen and (max-width:768px){
            .question-item{
                flex-direction:column;
                align-items:center;
                text-align:center;
                gap:14px;
                padding:14px;
            }
            .img-ring-wrap{
                flex-direction:column;
            }
            .options{
                justify-content:center;
            }
        }
        /* 菜品图片尺寸 */
        .dish-img{
            width:min(140px,70vw);
            height:auto;
            object-fit:contain;
            border-radius:6px;
            border:1px solid #eee;
        }
        /* 空心环形饼图 */
        .ring-chart{
            width:min(160px,38vw);
            height:min(160px,38vw);
            position:relative;
            border-radius:50%;
            background: conic-gradient(#b37957 var(--pEnd),#d9c997 var(--fEnd),#6c7c52 0);
            display:flex;
            align-items:center;
            justify-content:center;
            margin:8px 0 30px;
        }
        .ring-chart::after{
            content:"";
            width:55%;
            height:55%;
            background:#fff;
            border-radius:50%;
            z-index:2;
        }
        /*图例在圆环正下方 */
        .chart-legend{
            position:absolute;
            bottom:-26px;
            left:50%;
            transform:translateX(-50%);
            font-size:12px;
            line-height:1.6;
            white-space:nowrap;
        }
        .legend-item{
            display:inline-block;
            margin:0 4px;
        }
        .legend-item span{
            display:inline-block;
            width:12px;height:12px;
            margin-right:4px;
            vertical-align:middle;
            border-radius:2px;
        }
        .color-pro{background:#b37957;}
        .color-fat{background:#d9c997;}
        .color-carb{background:#6c7c52;}

        .q-content{flex:1;width:100%;}
        .question-title {
            font-size:clamp(15px,2vw,16px);
            color:#2c3e50;
            margin:12px 0;
            line-height:1.7;
        }
        .options {display:flex; gap:22px;}
        .option {
            padding:9px 28px;
            border:1px solid #ddd;
            border-radius:5px;
            cursor:pointer;
            transition:0.2s;
            font-size:16px;
        }
        .option:hover {background:#f0f4f8;border-color:#3498db;}
        .option.selected {background:#3498db;color:#fff;border-color:#3498db;}
        .submit-btn {
            display:block;
            margin:32px auto 0;
            background:#e74c3c;
        }
        .submit-btn:hover {background:#c0392b;}
        /*成绩页*/
        .result-box {display:none;text-align:center;padding:40px 0;}
        .result-box h2 {color:#27ae60;margin-bottom:20px;}
        .score {
            font-size:50px;
            font-weight:bold;
            color:#e67e22;
            margin:25px 0;
        }
        .restart-btn {
            margin-top:30px;
            background:#9b59b6;
        }
        .restart-btn:hover {background:#8e44ad;}
        /* 答题明细列表样式 */
        .result-list-title{
            margin:40px 0 20px;
            font-size:20px;
            color:#2c3e50;
        }
        .result-item{
            display:flex;
            align-items:center;
            gap:16px;
            border:1px solid #eee;
            border-radius:8px;
            padding:14px;
            margin-bottom:12px;
            text-align:left;
        }
        @media(max-width:768px){
            .result-item{
                flex-direction:column;
                text-align:center;
            }
        }
        .result-item-img{
            width:100px;
            height:auto;
            border-radius:6px;
            flex-shrink:0;
        }
        .result-item-text{
            line-height:1.8;
        }
        .right-tag{
            color:#27ae60;
            font-weight:bold;
        }
        .wrong-tag{
            color:#e74c3c;
            font-weight:bold;
        }
        #resultDetail{
            max-width:700px;
            margin:0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <!--登录输入姓名-->
        <div class="login-box" id="loginBox">
            <h2>菜品营养知识答题系统</h2>
            <input type="text" class="input-name" id="userName" placeholder="请输入答题人姓名">
            <br>
            <button class="btn" onclick="startExam()">开始随机答题</button>
        </div>
        <!--答题页面-->
        <div class="exam-box" id="examBox">
            <div class="user-info" id="userInfo"></div>
            <h2 class="title">营养判断题（每题20分，满分100）</h2>
            <div id="questionContainer"></div>
            <button class="btn submit-btn" onclick="submitExam()">提交全部答案</button>
        </div>
        <!--成绩结果-->
        <div class="result-box" id="resultBox">
            <h2>答题结束！</h2>
            <p id="resultText"></p>
            <div class="score" id="finalScore"></div>
            <!-- 答题明细容器 -->
            <h3 class="result-list-title">本次作答菜品明细</h3>
            <div id="resultDetail"></div>
            <button class="btn restart-btn" onclick="restartExam()">重新答题（刷新随机新题目）</button>
        </div>
    </div>

    <!--引入外置菜品数据库dishes.js -->
    <script src="./dishes.js"></script>
    <script>
        let currentQuestions = [];
        let userAnswers = [];
        let userName = "";
        const allDishList = dishData.菜品全量营养库;

        // 数组洗牌随机抽5题
        function shuffleArr(arr){
            let newArr = [...arr];
            for(let i=newArr.length-1;i>0;i--){
                let r = Math.floor(Math.random()*(i+1));
                [newArr[i],newArr[r]] = [newArr[r],newArr[i]];
            }
            return newArr;
        }
        function getRandomFive(){
            let shuffleList = shuffleArr(allDishList);
            return shuffleList.slice(0,5);
        }

        //进入答题
        function startExam(){
            userName = document.getElementById("userName").value.trim();
            if(!userName){
                alert("请填写姓名再开始！");
                return;
            }
            document.getElementById("loginBox").style.display="none";
            document.getElementById("examBox").style.display="block";
            document.getElementById("userInfo").innerText="答题人："+userName;
            currentQuestions = getRandomFive();
            userAnswers = new Array(5).fill(null);
            renderQuestion();
        }

        //渲染题目
        function renderQuestion(){
            let wrap = document.getElementById("questionContainer");
            wrap.innerHTML = "";
            currentQuestions.forEach((item,idx)=>{
                // 1. 直接从数据源读取真实碳水含量，不再用100倒推
                let pro = Number(item["每100ml蛋白质(g)"] || 0);
                let fat = Number(item["每100ml脂肪(g)"] || 0);
                let carb = Number(item["每100ml碳水(g)"] || 0);
                
                // 2. 按国标自动判定碳水分类，兜底兼容数据源预设值
                let carbType;
                if(item["碳水类型"]){
                    carbType = item["碳水类型"];
                }else{
                    if(carb <= 0.5) carbType = "无碳";
                    else if(carb <=5) carbType = "低碳";
                    else carbType = "高碳";
                }

                // 3. 饼图只按蛋白/脂肪/碳水三项真实数值算比例
                let total = pro + fat + carb;
                let proEnd = total===0 ? "0deg" : `${(pro/total)*360}deg`;
                let fatEnd = total===0 ? "0deg" : `${((pro+fat)/total)*360}deg`;

                let html = `
                <div class="question-item">
                    <!-- 图片+圆环包裹容器 PC左右并排 -->
                    <div class="img-ring-wrap">
                        <img class="dish-img" src="${item.img}" alt="${item.菜品名称}">
                        <div class="ring-chart" style="--pEnd:${proEnd};--fEnd:${fatEnd}">
                            <div class="chart-legend">
                                <span class="legend-item"><span class="color-pro"></span>蛋白</span>
                                <span class="legend-item"><span class="color-fat"></span>脂肪</span>
                                <span class="legend-item"><span class="color-carb"></span>碳水</span>
                            </div>
                        </div>
                    </div>
                    <div class="q-content">
                        <div class="question-title">
                            第${idx+1}题【${item.菜品名称}】<br>
                            每100ml：能量${item["每100ml能量(kcal)"]}kcal｜蛋白${pro}g｜脂肪${fat}g｜碳水分类：${carbType}<br>
                            问题：该食材是否属于抗炎抗氧化食材？
                        </div>
                        <div class="options">
                            <div class="option" onclick="choose(${idx},true,this)">是</div>
                            <div class="option" onclick="choose(${idx},false,this)">否</div>
                        </div>
                    </div>
                </div>
                `;
                wrap.innerHTML += html;
            })
        }

        //选择答案
        function choose(index,val,dom){
            userAnswers[index]=val;
            let ops = dom.parentElement.querySelectorAll(".option");
            ops.forEach(o=>o.classList.remove("selected"));
            dom.classList.add("selected");
        }

        //判分提交 + 渲染菜品明细列表
        function submitExam(){
            if(userAnswers.includes(null)){
                alert("还有题目未作答，不能提交！");
                return;
            }
            let score=0;
            let detailWrap = document.getElementById("resultDetail");
            detailWrap.innerHTML = "";
            currentQuestions.forEach((item,i)=>{
                // 计算得分
                let isCorrect = (item["是否抗炎抗氧化食材"] === userAnswers[i]);
                if(isCorrect) score+=20;
                // 获取碳水分类
                let carb = Number(item["每100ml碳水(g)"] || 0);
                let carbType = item["碳水类型"] ?? (carb <=0.5 ? "无碳" : carb<=5 ? "低碳" : "高碳");
                // 文字转换布尔值
                let userAnsText = userAnswers[i] ? "是" : "否";
                let realAnsText = item["是否抗炎抗氧化食材"] ? "是" : "否";
                let tagClass = isCorrect ? "right-tag" : "wrong-tag";
                let tagText = isCorrect ? "回答正确" : "回答错误";

                // 单条明细HTML
                let itemHtml = `
                <div class="result-item">
                    <img class="result-item-img" src="${item.img}" alt="${item.菜品名称}">
                    <div class="result-item-text">
                        <div><strong>菜品名称：</strong>${item.菜品名称}</div>
                        <div><strong>碳水类型：</strong>${carbType}</div>
                        <div><strong>天然抗炎抗氧化食材：</strong>${realAnsText}</div>
                        <div><strong>你的作答：</strong>${userAnsText} <span class="${tagClass}">${tagText}</span></div>
                    </div>
                </div>
                `;
                detailWrap.innerHTML += itemHtml;
            })

            // 切换页面
            document.getElementById("examBox").style.display="none";
            document.getElementById("resultBox").style.display="block";
            document.getElementById("resultText").innerText = `${userName}，本次测评得分：`;
            document.getElementById("finalScore").innerText = score+" 分";
        }

        //重置回到登录（修复id笔误result-box → resultBox）
        function restartExam(){
            document.getElementById("resultBox").style.display="none";
            document.getElementById("loginBox").style.display="block";
            document.getElementById("userName").value="";
            userName="";
            currentQuestions=[];
            userAnswers=[];
        }
    </script>
</body>
</html>
